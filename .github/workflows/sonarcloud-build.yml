name: SonarCloud Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
    BUILD_TYPE: Debug
    DEBIAN_FRONTEND: noninteractive
    BOOST_MINOR: 88

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Update packages
        run: |
         sudo apt-get update
         sudo apt-get -y upgrade

      - name: Set up Python 3.10 for gcovr
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: install gcovr
        run: |
          pip install gcovr

      - name: Install dependencies
        run: |
         sudo apt-get -y install dbus wget curl unzip openssl socat rsyslog zenity \
           xserver-xorg-video-dummy xserver-xorg xterm x11-xserver-utils dbus-x11 \
           libexpat1 libpam0g-dev gnutls-dev freerdp3-dev libxcb1-dev libxcb-xtest0-dev \
           libxcb-xfixes0-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-damage0-dev libxcb-keysyms1-dev \
           libxcb-xkb-dev libxkbcommon-x11-dev libsdl2-dev libsdl2-image-dev qtbase5-dev libsdbus-c++-bin libsdbus-c++-dev \
           libldap-dev libcups2-dev libfuse3-dev libsystemd-dev libopus-dev libpcsclite-dev libp11-kit-dev \
           liblz4-dev libturbojpeg-dev libxkbfile-dev libopenal-dev liburing-dev \
           libavdevice-dev libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev \
           libaudit-dev libspdlog-dev libboost-dev libpipewire-0.3-dev libgmock-dev libgtest-dev libkrb5-dev

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Boost1.88
        run: |
          wget https://archives.boost.io/release/1.${{env.BOOST_MINOR}}.0/source/boost_1_${{env.BOOST_MINOR}}_0.tar.bz2
          tar xf boost_1_${{env.BOOST_MINOR}}_0.tar.bz2 -C ${{github.workspace}}
          cd ${{github.workspace}}/boost_1_${{env.BOOST_MINOR}}_0
          ./bootstrap.sh
          ./b2

      - name: Configure and build
        run: |
          echo "fix user group"
          sed -i -e 's|ltsm-auth|adm|' ${{github.workspace}}/src/common/ltsm_global.h
          sed -i -e 's|ltsm-xvfb|runner|' ${{github.workspace}}/src/common/ltsm_global.h
          echo "start cmake"
          LTSM_BOOST_ROOT=${{github.workspace}}/boost_1_${{env.BOOST_MINOR}}_0 \
             cmake -B ${{github.workspace}}/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
                -DLTSM_BUILD_SERVER=on \
                -DLTSM_BUILD_CLIENT=on \
                -DLTSM_BUILD_TESTS=on \
                -DLTSM_BUILD_TOOLS=on \
                -DLTSM_BUILD_COVERAGE_TESTS=on
          echo "start build"
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 4

      - name: Prepare LTSM coverage tests
        run: |
          echo "::group::scripts"
          echo "info"
          /usr/bin/id
          echo "generate certs"
          openssl req -x509 -newkey rsa:1024 -subj '/C=RU/ST=Public/L=Irkutsk/O=Org/OU=Unit/CN=ltsm-docker/emailAddress=public.irkutsk@gmail.com' -nodes -days 1 -keyout ${{github.workspace}}/etc/ltsm/server.key -out ${{github.workspace}}/etc/ltsm/server.crt
          echo "copy ltsm files"
          chmod +x ${{github.workspace}}/etc/ltsm/xclients
          chmod +x ${{github.workspace}}/etc/ltsm/xsetup
          echo "change configs"
          sed -i -e "s|/usr/libexec/ltsm|${{github.workspace}}|" ${{github.workspace}}/etc/ltsm/ltsm_service.json
          sed -i -e "s|/usr/libexec/ltsm|${{github.workspace}}|" ${{github.workspace}}/etc/ltsm/ltsm_session_display.json
          sed -i -e 's|#starter|starter|' ${{github.workspace}}/etc/ltsm/ltsm_service.json
          sed -i -e 's|"#session:start:timeout": 3|"session:start:timeout": 7|' ${{github.workspace}}/etc/ltsm/ltsm_service.json
          sed -i -e 's|#helper|helper|' ${{github.workspace}}/etc/ltsm/ltsm_session_display.json
          echo "change group"
          sed -i -e 's|ltsm-dbus|adm|' ${{github.workspace}}/etc/dbus-1/ltsm.manager.service.conf
          sed -i -e 's|ltsm-xvfb|runner|' ${{github.workspace}}/etc/dbus-1/ltsm.session.display.conf
          echo "copy configs"
          sudo cp -r ${{github.workspace}}/etc/ltsm /etc
          sudo cp ${{github.workspace}}/etc/dbus-1/ltsm.manager.service.conf /usr/share/dbus-1/system.d
          sudo cp ${{github.workspace}}/etc/dbus-1/ltsm.session.display.conf /usr/share/dbus-1/session.d
          sudo cp ${{github.workspace}}/etc/xorg/ltsm.conf /etc/X11
          sudo sed -i -e 's|console|anybody|' /etc/X11/Xwrapper.config
          echo "::endgroup::"

      - name: Run tests to generate coverage statistics
        env:
          SOCAT_DEFAULT_LISTEN_IP: 127.0.0.1
          DISPLAY: :55
        shell: bash
        run: |
          echo "::group::run tests"
          ctest --test-dir build/src/tests/common
          ctest --test-dir build/src/tests/librfb
          echo "::endgroup::"
          echo "::group::test services"
          echo "run ltsm service"
          sudo ./ltsm_service &
          sleep 3
          echo "run socat connector"
          socat TCP4-LISTEN:5907,reuseaddr EXEC:"./ltsm_connector --config /etc/ltsm/ltsm_connector.json --type ltsm" &
          sleep 3
          echo "get vnc screenshot"
          ./ltsm_vnc2image --host 127.0.0.1 --port 5907 --timeout 300
          sleep 3
          grep -i ltsm /var/log/syslog
          echo "send shutdown service"
          dbus-send --dest=ltsm.manager.service --system --print-reply --type=method_call /ltsm/manager/service LTSM.Manager.Service.busShutdownService
          echo "wait"
          sleep 3
          echo "::endgroup::"
          echo "::group::x11 tests"
          /usr/bin/Xorg :55 -config ltsm.conf -nolisten tcp -quiet > /dev/null 2>&1 &
          sleep 1
          xsetroot -solid "#4e7db7"
          ./ltsm_test_xrandr
          echo "::endgroup::"
          echo "::group::ltsm logs"
          echo "::endgroup::"

      - name: Collect coverage into one XML report
        run: |
          gcovr --gcov-ignore-parse-errors=all \
            --merge-mode-functions=merge-use-line-max \
            --exclude 'boost_1_.*' \
            --exclude 'build/.*' \
            --exclude 'src/common/flat_hash_map/.*' \
            --exclude 'src/common/jsmn/.*' \
            --exclude 'src/common/libxcb-errors/.*' \
            --exclude 'src/tests/.*' \
            --sonarqube -o coverage.xml .

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.compile-commands=build/compile_commands.json
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.exclusions=boost_1_${{ env.BOOST_MINOR }}_0/**,build/**
